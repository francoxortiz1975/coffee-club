name: Supabase Keep-Alive Bot

on:
  schedule:
    # Corre 2 veces por semana (Lunes y Jueves 12:00 UTC) para estar bien dentro de la ventana de 7 días
    - cron: '0 12 * * 1,4'
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Services
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Usar secretos de GitHub o fallback a la URL del proyecto
          URL="${SUPABASE_URL:-https://ibbftjqwjtzdvuhrmypd.supabase.co}"
          KEY="${SUPABASE_ANON_KEY:-sb_publishable_kGZQ-Ln_uUIz0PgIln46MQ_QjJtFdX9}"

          echo "Pingeando Supabase URL: $URL"

          for i in 1 2 3; do
            echo "Intento $i..."
            STATUS_AUTH=$(curl -s -o /dev/null -w "%{http_code}" "$URL/auth/v1/health")
            STATUS_REST=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/" -H "apikey: $KEY")
            
            echo "Auth Health Response Code: $STATUS_AUTH"
            echo "REST API Response Code: $STATUS_REST"

            # Cualquier código HTTP válido (< 500 y no 000) confirma que el servidor de Supabase está activo
            if ([ "$STATUS_AUTH" -ne 0 ] && [ "$STATUS_AUTH" -lt 500 ]) || ([ "$STATUS_REST" -ne 0 ] && [ "$STATUS_REST" -lt 500 ]); then
              echo "✅ Supabase está activo y registrando tráfico correctamente."
              exit 0
            fi

            echo "Reintentando en 10 segundos..."
            sleep 10
          done

          echo "❌ No se pudo conectar a Supabase (Servidor deshabilitado o pausado)."
          exit 1
